[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goldrush2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "yfinance>=0.2,<1", "pandas>=2,<3", "openpyxl>=3.1,<4", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "google-genai>=1,<2"]

[project.scripts]
gr2 = "goldrush2.cli:main"
goldrush2 = "goldrush2.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
